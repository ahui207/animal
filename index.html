let currentQ = 0;
let answerList = Array(questionList.length).fill(null);

//密码校验
function checkPassword(){
    const inputPwd = document.getElementById("pwdInput").value.trim();
    const errDom = document.getElementById("pwdErr");
    if(inputPwd === RIGHT_PWD){
        document.querySelector(".page-lock").style.display="none";
        document.querySelector(".page-quiz").style.display="block";
        errDom.style.display="none";
        renderQuestion();
    }else{
        errDom.style.display="block";
    }
}

//渲染当前题目
function renderQuestion(){
    const q = questionList[currentQ];
    document.getElementById("qProgress").innerText = `第${currentQ+1}题 / 共${questionList.length}题`;
    let html = `<div class="q-title">${q.title}</div>`;
    q.opts.forEach(opt=>{
        const activeClass = answerList[currentQ] === opt.val ? "active" : "";
        html += `<div class="opt ${activeClass}" data-val="${opt.val}" onclick="selectOpt(this)">${opt.txt}</div>`;
    })
    document.getElementById("questionBox").innerHTML = html;

    //控制上一题按钮显示隐藏
    if(currentQ === 0){
        document.getElementById("prevBtn").style.display="none";
    }else{
        document.getElementById("prevBtn").style.display="inline-block";
    }
    //最后一题修改按钮文字为提交
    const nextBtn = document.getElementById("nextBtn");
    if(currentQ === questionList.length - 1){
        nextBtn.innerText = "查看结果";
    }else{
        nextBtn.innerText = "下一题";
    }
}

//选中选项，保存答案
function selectOpt(el){
    const parent = el.parentElement;
    parent.querySelectorAll(".opt").forEach(item=>item.classList.remove("active"));
    el.classList.add("active");
    answerList[currentQ] = el.dataset.val;
}

//下一题 / 提交
function nextQuestion(){
    // 没选答案提示
    if(!answerList[currentQ]){
        alert("请选择一个答案再继续！");
        return;
    }
    //最后一题，计算结果
    if(currentQ === questionList.length -1){
        calcResult();
        return;
    }
    currentQ++;
    renderQuestion();
}

//上一题
function prevQuestion(){
    if(currentQ>0){
        currentQ--;
        renderQuestion();
    }
}

//渲染结果
function renderResult(animal){
    document.getElementById("animalImg").src = animal.img;
    document.getElementById("animalName").innerText = animal.name;
    document.getElementById("animalSubTitle").innerText = animal.sub;
    document.getElementById("quoteText").innerText = animal.quote;
    document.getElementById("adviceText").innerText = animal.advice;
    // 清空+重新渲染指数板块，加固代码
    let indexHtml = "";
    animal.index.forEach(item=>{
        indexHtml += `
        <div class="index-item">
            <div class="index-name">
                <span>${item.name}</span>
                <span>${item.val}%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-bar" style="width:${item.val}%"></div>
            </div>
        </div>
        `;
    })
    // 核心修复：先清空再写入
    const indexWrap = document.getElementById("indexBox");
    indexWrap.innerHTML = "";
    indexWrap.innerHTML = indexHtml;

    document.querySelector(".page-quiz").style.display = "none";
    document.querySelector(".page-result").style.display = "block";
}

//计分逻辑【修复】
function calcResult(){
    let scoreA=0,scoreB=0,scoreC=0,scoreD=0;
    answerList.forEach(v=>{
        if(v==="A")scoreA++;
        if(v==="B")scoreB++;
        if(v==="C")scoreC++;
        if(v==="D")scoreD++;
    })
    const scores = [
        {key:"A",val:scoreA,animal:animalData[0]},
        {key:"B",val:scoreB,animal:animalData[1]},
        {key:"C",val:scoreC,animal:animalData[5]},
        {key:"D",val:scoreD,animal:animalData[14]}
    ]
    //降序排序
    scores.sort((a,b)=>b.val - a.val);
    const maxVal = scores[0].val;
    //拿到所有最高分的组别
    const topList = scores.filter(s=>s.val === maxVal);
    let targetAnimal;
    if(topList.length === 1){
        targetAnimal = topList[0].animal;
    }else{
        //同分，随机从top里选一个
        const rndIdx = Math.floor(Math.random() * topList.length);
        targetAnimal = topList[rndIdx].animal;
    }
    renderResult(targetAnimal);
}
